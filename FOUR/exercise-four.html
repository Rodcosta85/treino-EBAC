<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JS</title>
    <script src="exercise-four.js"></script>
    <link rel="stylesheet" href="exercise-four.css">
</head>
<body>
    <h1>This is a BMI (body mass index) calculator</h1>
    <h2>Insert your weight and height so you can check your BMI status</h2>
    <main>
        <input type="number" name="weight" id="weight">
        <input type="number" name="height" id="height">
        <button id="calculate">Calculate my BMI</button>
        <p id="bmi-result">Please insert your info and press the button to calculate</p>
        <p id="bmi-qualification"></p>
    </main>
</body>
</html>
