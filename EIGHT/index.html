<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÓDULO 8 - EXERCÍCIO</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <form action="" autocomplete="off" id="my-form">
        <input type="text" id="name" placeholder="Nome" autocomplete="off">
        <input type="text" id="last-name" placeholder="Sobrenome" autocomplete="off">
        <input type="email" id="email"  placeholder="Email" autocomplete="off">
        <input type="text" id="cep" name="myCEP" autocomplete="off">
        <input type="text" id="neighborhood" name="myNeighborhood" autocomplete="off">
        <input type="text" id="street" name="myStreet" autocomplete="off">
        <button type="submit" id="enviar">Enviar</button>
    </form>
</body>
</html>
