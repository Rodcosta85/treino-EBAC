<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÓDULO 9 - OFICIAL</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="./app.js"></script>
</head>

<body>
    <div class="wrapper">
        <h1>Cadastre seu nome, sobrenome e email abaixo:</h1>
        <form id="register-form">
            <input type="text" name="name" id="name" placeholder="Nome">
            <input type="text" name="last-name" id="last-name" placeholder="Sobrenome">
            <input type="email" name="email" id="email" placeholder="E-mail">
            <button type="button" id="add-btn">Registrar</button>
        </form>
    </div>
    <div class="wrapper">
        <h1>Abaixo está uma listagem completa dos usuários adicionados:</h1>
        <ul id="user-list">
        </ul>
    </div>
</body>

</html>
